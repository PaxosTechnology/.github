<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1800" height="520" viewBox="0 0 1800 520"
     role="img" aria-labelledby="title desc">
  <title id="title">PaXos — logotipo vetorial</title>
  <desc id="desc">Wordmark PAXOS em branco, com a letra X tecnológica em gradiente azul e ciano, sobre fundo transparente.</desc>

  <defs>
    <linearGradient id="xGradient" x1="0" y1="0" x2="440" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#126BFF"/>
      <stop offset="0.23" stop-color="#1BA9FF"/>
      <stop offset="0.48" stop-color="#2FF3D7"/>
      <stop offset="0.52" stop-color="#2FF3D7"/>
      <stop offset="0.77" stop-color="#1BA9FF"/>
      <stop offset="1" stop-color="#126BFF"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8AFFF3" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#2FF3D7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#13A0FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="xGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="
        0 0 0 0 0.05
        0 0 0 0 0.78
        0 0 0 0 0.92
        0 0 0 0.72 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Lettering is converted to vector outlines, so no font file is required. -->
  <g fill="#020812" stroke="#020812" stroke-width="7" paint-order="stroke fill" opacity="0.58">
    <path d="M96 0H456V482H704C1049 482 1267 677 1267 986C1267 1295 1051 1490 706 1490H96ZM456 781V1192H681C825 1192 916 1113 916 986C916 860 825 781 681 781Z" transform="translate(79 405) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M5 0H396L487 287H1016L1104 0H1506L991 1490H517ZM577 568 604 655C656 821 704 984 755 1167C805 984 853 821 902 655L929 568Z" transform="translate(379 405) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M765 -24C1167 -24 1477 259 1477 744C1477 1230 1167 1514 765 1514C361 1514 52 1230 52 744C52 261 361 -24 765 -24ZM765 290C551 290 414 456 414 744C414 1033 551 1200 765 1200C978 1200 1115 1033 1115 744C1115 456 978 290 765 290Z" transform="translate(1122 405) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M689 -24C1073 -24 1301 153 1301 453C1301 683 1158 814 828 880L697 906C527 941 456 986 456 1067C456 1160 551 1225 687 1225C829 1225 924 1149 934 1026H1267C1258 1331 1039 1514 682 1514C332 1514 96 1327 96 1050C96 833 245 689 536 629L689 598C868 561 945 512 945 427C945 329 844 265 692 265C520 265 415 349 410 492H67C67 163 292 -24 689 -24Z" transform="translate(1455 405) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
  </g>
  <g fill="#F8FAFD" stroke="#07101C" stroke-width="4.5" paint-order="stroke fill">
    <path d="M96 0H456V482H704C1049 482 1267 677 1267 986C1267 1295 1051 1490 706 1490H96ZM456 781V1192H681C825 1192 916 1113 916 986C916 860 825 781 681 781Z" transform="translate(74 397) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M5 0H396L487 287H1016L1104 0H1506L991 1490H517ZM577 568 604 655C656 821 704 984 755 1167C805 984 853 821 902 655L929 568Z" transform="translate(374 397) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M765 -24C1167 -24 1477 259 1477 744C1477 1230 1167 1514 765 1514C361 1514 52 1230 52 744C52 261 361 -24 765 -24ZM765 290C551 290 414 456 414 744C414 1033 551 1200 765 1200C978 1200 1115 1033 1115 744C1115 456 978 290 765 290Z" transform="translate(1117 397) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
    <path d="M689 -24C1073 -24 1301 153 1301 453C1301 683 1158 814 828 880L697 906C527 941 456 986 456 1067C456 1160 551 1225 687 1225C829 1225 924 1149 934 1026H1267C1258 1331 1039 1514 682 1514C332 1514 96 1327 96 1050C96 833 245 689 536 629L689 598C868 561 945 512 945 427C945 329 844 265 692 265C520 265 415 349 410 492H67C67 163 292 -24 689 -24Z" transform="translate(1450 397) scale(0.1912751677852349 -0.1912751677852349)" vector-effect="non-scaling-stroke"/>
  </g>

  <!-- Enhanced, technology-inspired X. -->
  <g transform="translate(676 47)" filter="url(#xGlow)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Atmospheric glow, still on a transparent canvas. -->
    <ellipse cx="220" cy="212" rx="136" ry="122" fill="url(#centerGlow)" opacity="0.30" filter="url(#softGlow)"/>

    <!-- Subtle body gives the X more presence without losing the network character. -->
    <path d="M20 18
             C98 23 138 67 190 145
             C204 166 214 183 220 193
             C226 183 236 166 250 145
             C302 67 342 23 420 18
             C358 82 324 132 276 210
             C324 288 358 338 420 406
             C342 401 302 357 250 279
             C236 258 226 241 220 231
             C214 241 204 258 190 279
             C138 357 98 401 20 406
             C82 338 116 288 164 210
             C116 132 82 82 20 18 Z"
          fill="url(#xGradient)" fill-opacity="0.10"
          stroke="url(#xGradient)" stroke-width="11"/>

    <!-- Primary diagonals. -->
    <path d="M24 22 C112 40 145 100 220 210 C295 320 328 380 416 402"
          fill="none" stroke="url(#xGradient)" stroke-width="8.5"/>
    <path d="M416 22 C328 40 295 100 220 210 C145 320 112 380 24 402"
          fill="none" stroke="url(#xGradient)" stroke-width="8.5"/>

    <!-- Secondary network lines. -->
    <path d="M55 25 C131 63 157 123 220 196 C283 123 309 63 385 25"
          fill="none" stroke="url(#xGradient)" stroke-width="4.8" opacity="0.96"/>
    <path d="M55 399 C131 361 157 301 220 224 C283 301 309 361 385 399"
          fill="none" stroke="url(#xGradient)" stroke-width="4.8" opacity="0.96"/>
    <path d="M78 53 C142 82 168 137 220 184 C272 137 298 82 362 53"
          fill="none" stroke="#51F4E4" stroke-width="3.2" opacity="0.84"/>
    <path d="M78 371 C142 342 168 287 220 236 C272 287 298 342 362 371"
          fill="none" stroke="#51F4E4" stroke-width="3.2" opacity="0.84"/>
    <path d="M44 45 C118 108 148 155 201 210 C148 265 118 312 44 379"
          fill="none" stroke="#238FFB" stroke-width="3.4" opacity="0.76"/>
    <path d="M396 45 C322 108 292 155 239 210 C292 265 322 312 396 379"
          fill="none" stroke="#238FFB" stroke-width="3.4" opacity="0.76"/>

    <!-- Nodes. -->
    <g fill="#177DFF" stroke="#A6FFF6" stroke-width="1.2">
      <circle cx="20" cy="18" r="10"/>
      <circle cx="420" cy="18" r="10"/>
      <circle cx="20" cy="406" r="10"/>
      <circle cx="420" cy="406" r="10"/>
    </g>
    <g fill="#35EEDB" stroke="#D6FFFB" stroke-width="1">
      <circle cx="112" cy="71" r="6.2"/>
      <circle cx="328" cy="71" r="6.2"/>
      <circle cx="112" cy="353" r="6.2"/>
      <circle cx="328" cy="353" r="6.2"/>
      <circle cx="166" cy="139" r="5.2"/>
      <circle cx="274" cy="139" r="5.2"/>
      <circle cx="166" cy="281" r="5.2"/>
      <circle cx="274" cy="281" r="5.2"/>
    </g>

    <!-- Bright focal point. -->
    <circle cx="220" cy="210" r="29" fill="url(#centerGlow)" opacity="0.80" filter="url(#softGlow)"/>
    <circle cx="220" cy="210" r="13" fill="#31F3DA" stroke="#AFFFF6" stroke-width="2"/>
    <path d="M220 192 L238 210 L220 228 L202 210 Z" fill="none" stroke="#8DFFF3" stroke-width="2.4" opacity="0.92"/>
  </g>
</svg>
